# Live reload for Kafka worker (cmd/worker). Use: make air-worker
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/worker"
  cmd = "go build -o ./tmp/worker ./cmd/worker"
  entrypoint = ["./tmp/worker"]
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "deployments", "docs", ".github"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  log = "build-errors.worker.log"
  send_interrupt = true
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = true
