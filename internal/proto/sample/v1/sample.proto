syntax = "proto3";

package sample.v1;

option go_package = "clean-template/internal/proto/sample/v1;samplev1";

import "google/protobuf/timestamp.proto";

service SampleService {
  rpc CreateSample(CreateSampleRequest) returns (SampleResponse);
  rpc GetSample(GetSampleRequest) returns (SampleResponse);
  rpc ListSamples(ListSamplesRequest) returns (ListSamplesResponse);
  rpc UpdateSample(UpdateSampleRequest) returns (SampleResponse);
  rpc DeleteSample(DeleteSampleRequest) returns (DeleteSampleResponse);
}

message CreateSampleRequest {
  string name = 1;
  string description = 2;
  string status = 3;
}

message GetSampleRequest {
  string id = 1;
}

message ListSamplesRequest {
  int32 page = 1;
  int32 per_page = 2;
}

message UpdateSampleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
}

message DeleteSampleRequest {
  string id = 1;
}

message DeleteSampleResponse {
  bool success = 1;
}

message SampleResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListSamplesResponse {
  repeated SampleResponse items = 1;
  int64 total = 2;
}
